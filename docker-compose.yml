version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ultra
      POSTGRES_PASSWORD: ultra_dev_password
      POSTGRES_DB: ultra_dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ultra_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ultra"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Separate database for integration tests — tests/integration/setup.ts
  # refuses to run against any DATABASE_URL that doesn't contain "test",
  # specifically so a misconfigured env can't accidentally truncate dev data.
  postgres_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ultra
      POSTGRES_PASSWORD: ultra_test_password
      POSTGRES_DB: ultra_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ultra"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ultra_postgres_data:
